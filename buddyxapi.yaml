    TeamMember:
      type: object
      properties:
        id:                 { type: string, example: '4711', description: 'OFB user ID of the team member. Matches the `ofbUserId` / `chatterId` fields returned by `/v1/public/messages` and `/v1/public/team-reports/*`.' }
        name:               { type: string, nullable: true, example: 'Alex Chatter' }
        email:              { type: string, nullable: true, example: 'alex@example.com' }
        status:             { type: string, nullable: true, example: 'active', description: 'Lifecycle status of the member. One of `active`, `invite-pending`, or `inactive`. `invite-pending` means the manager has sent the invite email but the user has not yet activated their account.' }
        timeZone:           { type: string, nullable: true, example: 'Europe/Berlin', description: 'IANA time zone configured for the member.' }
