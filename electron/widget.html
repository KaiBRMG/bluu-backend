<!DOCTYPE html>
<!--
  Windows timer HUD — the small frameless, transparent, always-on-top pill that
  docks just above the system tray. macOS has no equivalent because it uses the
  menu-bar tray title instead (Tray.setTitle is darwin-only).

  Main owns the clock: it re-derives the time each second from the anchor the
  renderer pushed and sends the finished string here on 'timer-widget:tick'.
  This page holds no timer of its own — one clock, one source of truth.

  Visual language follows DESIGN.md: Surface ground, a single hairline border,
  no shadow, tabular numerals. The state hue is NOT hardcoded here — it arrives
  in the tick, sourced from STATE_CONFIG (src/lib/stateColors.ts), so the widget
  can never drift from the colours the time-tracking page uses.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Bluu Timer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      /* The pill is a handle: the widget docks above the tray by default, but
         the user can drag it off whatever it is covering. */
      cursor: grab;
    }

    body.dragging { cursor: grabbing; }

    .pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 100%;
      /* Surface (#171717), a shade off opaque so it still reads as part of the
         desktop rather than a pasted rectangle. Depth is the hairline, never a
         shadow (DESIGN.md — The No-Shadow Rule). */
      background: rgba(23, 23, 23, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 999px;
      /* The only hover affordance: the hairline lifts, so the pill reads as
         grabbable without a shadow or a scale (DESIGN.md). */
      transition: border-color 120ms ease-out;
    }

    body:hover .pill { border-color: rgba(255, 255, 255, 0.22); }

    .icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      /* One asset set for both platforms: the same black+alpha template PNG the
         macOS tray uses, tinted here through its alpha channel. */
      background-color: #ffffff;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;
      transition: background-color 120ms ease-out;
    }

    .time {
      font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.01em;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      font-feature-settings: 'tnum' 1;
    }
  </style>
</head>
<body>
  <div class="pill">
    <div class="icon" id="icon" role="img" aria-label="Timer state"></div>
    <div class="time" id="time">--:--:--</div>
  </div>

  <script>
    // Fixed lookup — the state from the tick indexes this table and is never
    // interpolated into a path, so a malformed value can only fail to match.
    var ICON_FILE = {
      'working': 'workingTemplate@2x.png',
      'idle': 'idleTemplate@2x.png',
      'on-break': 'breakTemplate@2x.png',
      'paused': 'pausedTemplate@2x.png'
    };

    var iconEl = document.getElementById('icon');
    var timeEl = document.getElementById('time');
    var currentState = null;

    // ── Moving the widget ───────────────────────────────────────────────────
    //
    // The window rests CLICK-THROUGH with mouse-move forwarding, so it never
    // swallows a click in the corner it lives in. Those forwarded moves are the
    // only signal that the cursor has arrived — on entry we ask main to make the
    // window solid (so a press is actually delivered), and on exit we hand the
    // corner straight back.
    //
    // We send no coordinates: main reads the OS cursor and owns the clamp, which
    // is both the accurate way to do it and the reason this page cannot ask to
    // be put anywhere in particular.
    var dragging = false;
    var interactive = false;

    // Deduped: forwarded moves arrive continuously, and this is an IPC.
    function setInteractive(on) {
      if (on === interactive) return;
      interactive = on;
      if (window.timerWidget.setInteractive) window.timerWidget.setInteractive(on);
    }

    // mousemove as well as mouseover: the forwarded stream is guaranteed to
    // produce moves, whereas over/enter depend on a hit-tested element boundary
    // actually being crossed.
    document.addEventListener('mousemove', function () { setInteractive(true); });
    document.addEventListener('mouseover', function () { setInteractive(true); });
    document.addEventListener('mouseout', function (e) {
      // relatedTarget null == the cursor left the window, not just crossed
      // between the icon and the label inside it.
      if (!e.relatedTarget && !dragging) setInteractive(false);
    });

    document.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      dragging = true;
      document.body.classList.add('dragging');
      // Capture guarantees the matching pointerup lands here even when a fast
      // drag outruns the window — without it a released grab would keep
      // following the cursor.
      try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* not fatal */ }
      window.timerWidget.dragStart();
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove('dragging');
      window.timerWidget.dragEnd();
    }

    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);
    // Losing the window (a display change, a session lock) must not leave a
    // grab latched on with no pointer to end it.
    window.addEventListener('blur', endDrag);

    // Right-click snaps back to the dock above the tray — the way back for
    // anyone who parks it somewhere they did not mean to. Not double-click: a
    // left press that does not move is a click, and main reads that as "surface
    // the app", so a double-click would raise the window on its way through.
    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      endDrag();
      window.timerWidget.resetPosition();
    });

    window.timerWidget.onTick(function (data) {
      if (!data) return;

      timeEl.textContent = data.text || '--:--:--';

      if (data.state !== currentState) {
        currentState = data.state;
        var file = ICON_FILE[data.state];
        iconEl.style.webkitMaskImage = file ? "url('public/tray/" + file + "')" : 'none';
        iconEl.setAttribute('aria-label', data.label || 'Timer state');
      }
      // Colour is re-applied every tick rather than only on a state change: it
      // is one cheap style write, and it means a dropped state transition can
      // never leave the pill wearing the previous state's hue.
      iconEl.style.backgroundColor = data.color || '#ffffff';
    });
  </script>
</body>
</html>
