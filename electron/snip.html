<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Snip</title>
  <style>
    /*
      The selection surface: one per display, sized to that display's bounds.

      IT DRAWS ALMOST NOTHING. The page is fully transparent; the only ink it
      puts on screen is the selection rectangle while the user is dragging one,
      its size readout, and — on the one surface under the cursor — the mode bar
      at the bottom. What the user sees is their own live desktop, a crosshair
      cursor, and a box they are drawing. There is no scrim, no dimming, and no
      photograph of the screen underneath.

      The window still exists, and has to: no OS gives an application a global
      cursor change or global mouse capture without one. Making it (almost)
      invisible is the whole design — see the snip section of electron/main.js
      for why the capture is taken AFTER the rectangle is hidden rather than
      before the surface opens.

      ## Why there is now a bar, when there deliberately was not

      This file used to carry a standing note that there was no hint pill and no
      instruction chrome, because the brief was "a cursor and a box". That still
      holds for *instructions* — nothing here tells the user to drag, or that
      Escape cancels. What the bar carries is a **choice that cannot be made
      anywhere else**: whether this capture is a still or a recording, and what
      audio a recording takes. That choice has to be made before the drag,
      because the drag is the last thing that happens, and there is no other
      surface on screen to make it on.

      It is cleared with the marks before the commit, so it is never in the
      capture — and it is rendered on ONE surface only (the display under the
      cursor), because two bars on two monitors would be two sets of toggles
      disagreeing about one capture.
    */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /*
      `[hidden]` has to be declared here, and it has to carry `!important`.

      The UA stylesheet's `[hidden] { display: none }` loses to ANY author rule
      that sets `display`, regardless of specificity — author sheets simply beat
      the UA sheet. Every control on this bar is `display: flex`, so setting
      `el.hidden = true` on one did exactly nothing: the System audio toggle
      stayed on screen in Image mode, and the Image/Video pair failed to hide on
      a shell too old for recording.

      One rule rather than a `[hidden]` variant per selector. There was already
      a `.note[hidden]` override here, which was the tell that this needed
      solving once, globally, instead of being rediscovered per element.
    */
    [hidden] { display: none !important; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Not a colour — the compositor must see through to the real desktop. */
      background: transparent;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
      font-family: "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /*
      The rectangle has to stay legible over content we do not control — a white
      document, a dark terminal, a photograph. So it is a 1px Action Blue border
      with a dark 1px outline sitting just outside it: whichever of the two the
      background swallows, the other survives. The fill is barely there (0.10)
      for the same reason — enough to read the shape at a glance, not enough to
      obscure what is being captured, which is the thing the user is aiming at.
    */
    #selection {
      position: absolute;
      display: none;
      border: 1px solid #3b82f6;
      outline: 1px solid rgba(0, 0, 0, 0.55);
      background: rgba(59, 130, 246, 0.10);
    }

    /* The live size, pinned to the selection. It only exists while a drag is in
       progress. */
    #readout {
      position: absolute;
      display: none;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(9, 9, 11, 0.92);
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /*
      The mode bar. DESIGN.md's dark vocabulary by hand, because this page has no
      Tailwind and no shadcn: canvas-dark panel, hairline border, Ink Secondary
      labels, Action Blue Deep for the one filled state. It floats over a live
      desktop rather than over the app's canvas, so it is opaque and shadowed
      where an in-app panel would be translucent — a translucent bar over an
      unknown background is an unreadable bar.
    */
    #bar {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(9, 9, 11, 0.94);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      cursor: default;
    }
    #bar.visible { display: flex; }

    /*
      Spacing on this bar is a 2px scale with three steps and one job each:
      2px insets a track inside its own frame, 4px separates controls that
      belong to the same group, and 12px separates the groups. Nothing uses a
      value because it "looked about right" — 6px, 7px and 8px were all in use
      here at one point, which is three indistinguishable values doing one job
      and reads as noise rather than structure.
    */
    .row { display: flex; align-items: center; gap: 4px; }

    /* The Image | Video segmented control. */
    .seg {
      display: flex;
      padding: 2px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
    }
    .seg button {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #a1a1aa;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: default;
    }
    .seg button:hover { color: #ffffff; }
    /* Filled at Action Blue DEEP, not at #3b82f6 — this chip carries white text
       at 12px, and white on #3b82f6 is 3.68:1. DESIGN.md section 2. */
    .seg button[aria-pressed="true"] { background: #2563eb; color: #ffffff; }
    .seg button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }

    /* An audio toggle: a checkbox that reads as a chip. */
    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 9px;
      background: transparent;
      color: #a1a1aa;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: default;
      white-space: nowrap;
    }
    .chip:hover:not([disabled]) { color: #ffffff; border-color: rgba(255, 255, 255, 0.18); }
    .chip[aria-pressed="true"] {
      border-color: rgba(59, 130, 246, 0.45);
      background: rgba(59, 130, 246, 0.14);
      color: #ffffff;
    }
    /* Ink Muted is not a text colour, but this is a disabled affordance — the
       one thing DESIGN.md does reserve it for. */
    .chip[disabled] { color: #71717a; border-color: rgba(255, 255, 255, 0.06); }
    .chip:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }

    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor; opacity: 0.45;
    }
    .chip[aria-pressed="true"] .dot { background: #3b82f6; opacity: 1; }

    /*
      The microphone chip carries a GLYPH rather than the `.dot` the system
      audio chip uses, and the two are deliberately different marks.

      A dot is a state light: on or off. The microphone needs to say more than
      that — it can be on, off, or unavailable because the OS has not granted
      it — and a slashed mic is the one drawing every user already reads as
      "this input is not live". Colour alone could not carry the third state
      (DESIGN.md: colour is never the sole carrier), and a second dot in a
      different hue beside the first would read as two instances of one thing.
    */
    .mic-glyph { width: 13px; height: 13px; flex: none; opacity: 0.55; }
    .chip[aria-pressed="true"] .mic-glyph { opacity: 1; color: #3b82f6; }
    .chip[data-blocked="1"] .mic-glyph { opacity: 1; color: #fb923c; }

    /*
      The device picker.

      A native `<select>`, and that is the right call on this surface rather
      than a laziness: its popup is rendered by the OS, ABOVE an always-on-top
      transparent window that a custom dropdown would have to escape by hand —
      and it arrives with keyboard support, type-ahead and screen-reader
      semantics that would otherwise all have to be rebuilt on a page whose CSP
      forbids every library that might have helped.

      It only exists while the microphone is on, so it never occupies the bar
      for a user who is not narrating.
    */
    .device {
      max-width: 190px;
      padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.05);
      color: #e4e4e7;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: default;
      /* The UA arrow is drawn in the platform's own colour, which on Windows
         is near-black on our near-black bar. */
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 6px center;
      background-size: 13px 13px;
      padding-right: 24px;
      text-overflow: ellipsis;
    }
    .device:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }
    .device[disabled] { color: #71717a; }
    /* The options themselves are an OS popup, so they need their own ground —
       they do not inherit the bar's. */
    .device option { background: #18181b; color: #e4e4e7; }

    /*
      The one action on this bar that is not a toggle: the way out of a denied
      microphone. Outlined in warning orange rather than filled — nothing has
      gone wrong yet, the user simply cannot narrate until they grant access,
      and a red or a filled blue control here would outrank Image/Video.
    */
    .grant {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      border: 1px solid rgba(251, 146, 60, 0.45);
      border-radius: 9px;
      background: rgba(251, 146, 60, 0.10);
      color: #fb923c;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: default;
      white-space: nowrap;
    }
    .grant:hover { background: rgba(251, 146, 60, 0.18); color: #fdba74; }
    .grant:focus-visible { outline: 2px solid #3b82f6; outline-offset: 1px; }

    .note {
      max-width: 340px;
      padding: 0 4px 2px;
      color: #a1a1aa;
      font-size: 11px;
      line-height: 1.4;
    }

    /*
      The divider between "what kind of capture" and "what audio to take".

      This is the one **generous** separation on the bar, and it has to be
      unmistakably larger than the gap between the controls it divides or it
      does no work. Against the row's 4px gap, a 12px margin each side puts
      ~29px between the mode control and the first audio chip while the two
      chips stay 4px apart — a 7:1 ratio, read instantly.

      An earlier version used 7px here against a 6px row gap. That is the
      failure this comment exists to prevent: a separation one pixel wider than
      the thing it separates is not a separation, and the bar read as one
      undifferentiated run of five controls — which is exactly what it is not.
      The left side chooses a mode; the right side configures one of them.
    */
    .sep {
      width: 1px;
      align-self: stretch;
      margin: 2px 12px;
      background: rgba(255, 255, 255, 0.10);
    }
  </style>
</head>
<body>
  <div id="selection"></div>
  <div id="readout"></div>

  <div id="bar" role="group" aria-label="Capture mode">
    <div class="row">
      <div class="seg" role="group" aria-label="Capture type">
        <button type="button" id="mode-image" aria-pressed="true">Image</button>
        <button type="button" id="mode-video" aria-pressed="false">Video</button>
      </div>
      <div class="sep" id="audio-sep" hidden></div>
      <button type="button" class="chip" id="opt-sys" aria-pressed="false" hidden>
        <span class="dot" aria-hidden="true"></span>System audio
      </button>
      <button type="button" class="chip" id="opt-mic" aria-pressed="false" hidden>
        <svg class="mic-glyph" id="mic-glyph-on" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="11" rx="3" />
          <path d="M5 10a7 7 0 0 0 14 0M12 17v5" />
        </svg>
        <svg class="mic-glyph" id="mic-glyph-off" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" hidden>
          <path d="M15 5a3 3 0 0 0-6 0v4m0 3a3 3 0 0 0 5 2" />
          <path d="M5 10a7 7 0 0 0 10.5 6M19 10a7 7 0 0 1-1 3.5M12 17v5" />
          <path d="M3 3l18 18" />
        </svg>
        <span id="mic-label">Microphone</span>
      </button>
      <!-- Only while the microphone is ON. A picker for a device nobody is
           recording from is a control with nothing to configure. -->
      <select class="device" id="mic-device" aria-label="Microphone input" hidden></select>
      <!-- Only while access is missing. It replaces the picker rather than
           sitting beside it, because until this is resolved there is nothing
           to pick from. -->
      <button type="button" class="grant" id="mic-grant" hidden></button>
    </div>
    <p class="note" id="note" hidden></p>
  </div>

  <script>
    (function () {
      const selection = document.getElementById('selection');
      const readout = document.getElementById('readout');
      const bar = document.getElementById('bar');
      const note = document.getElementById('note');
      const btnImage = document.getElementById('mode-image');
      const btnVideo = document.getElementById('mode-video');
      const btnSys = document.getElementById('opt-sys');
      const audioSep = document.getElementById('audio-sep');
      const btnMic = document.getElementById('opt-mic');
      const micLabel = document.getElementById('mic-label');
      const micGlyphOn = document.getElementById('mic-glyph-on');
      const micGlyphOff = document.getElementById('mic-glyph-off');
      const micDevice = document.getElementById('mic-device');
      const micGrant = document.getElementById('mic-grant');

      /** Smaller than this is a mis-click, not a selection. */
      const MIN_SIDE = 8;

      const params = new URLSearchParams(window.location.search);
      const flag = (name) => params.get(name) === '1';

      /** Only the surface under the cursor draws the bar. */
      const hasControls = flag('controls');
      /** False on a shell whose main process predates the recorder. */
      const videoSupported = flag('video');
      /** System-audio loopback is not available on every platform; main decides
       *  and tells us, rather than this page guessing from a user agent. */
      const systemAudioSupported = flag('sysaudio');

      /** False on a platform with no microphone permission to read (Linux). */
      const micSupported = flag('mic');

      const state = {
        mode: 'image',
        system: systemAudioSupported && flag('sys'),
        mic: micSupported && flag('micon'),
        /**
         * The OS's answer, seeded by main at window creation and re-read on
         * every interaction.
         *
         * **Never cached beyond one interaction.** The whole point of the
         * grant button is that the user leaves, changes a setting, and comes
         * back — so a status read once at load and trusted afterwards is a
         * surface that keeps telling a user who has just granted access that
         * they have not.
         */
        micStatus: params.get('micstate') || 'unknown',
        micDeviceId: params.get('micdev') || '',
        devices: [],
        /**
         * Set when `enumerateDevices` returned audio inputs whose ids were
         * blanked — i.e. the hardware is there and the permission is not.
         *
         * This distinction exists because conflating the two produced a real
         * bug that was impossible to diagnose from the UI: a blocked
         * enumeration is indistinguishable from absent hardware if you only
         * count the devices that survive filtering, so the surface confidently
         * told people with working microphones that none was found.
         */
        micDevicesBlocked: false,
      };

      let origin = null;
      /** Latched at the first cancel/commit so a stray second event — an Escape
       *  landing between mouseup and the window closing — cannot send twice. */
      let settled = false;

      function rectFrom(a, b) {
        return {
          x: Math.round(Math.min(a.x, b.x)),
          y: Math.round(Math.min(a.y, b.y)),
          width: Math.round(Math.abs(a.x - b.x)),
          height: Math.round(Math.abs(a.y - b.y)),
        };
      }

      function draw(rect) {
        selection.style.display = 'block';
        selection.style.left = rect.x + 'px';
        selection.style.top = rect.y + 'px';
        selection.style.width = rect.width + 'px';
        selection.style.height = rect.height + 'px';

        readout.style.display = 'block';
        readout.textContent = rect.width + ' × ' + rect.height;
        // 22px clears the readout's own height; it flips below the box when the
        // selection is hard against the top edge and there is no room above.
        const above = rect.y >= 22;
        readout.style.left = rect.x + 'px';
        readout.style.top = (above ? rect.y - 22 : rect.y + rect.height + 6) + 'px';
      }

      /** Take every mark off the screen — INCLUDING the bar. Called before
       *  committing, because the capture happens after this and every pixel
       *  still on screen is real ink that would be photographed along with the
       *  content inside the rectangle. */
      function clearMarks() {
        selection.style.display = 'none';
        readout.style.display = 'none';
        bar.classList.remove('visible');
      }

      function cancel() {
        if (settled) return;
        settled = true;
        clearMarks();
        window.snipAPI.cancel();
      }

      // -- The bar ------------------------------------------------------

      function setNote(text) {
        note.textContent = text || '';
        note.hidden = !text;
      }

      /**
       * The microphone's states, and what each one offers.
       *
       * This is the whole "graceful" part of the flow, so it is written as one
       * function rather than scattered across handlers. The rule it enforces:
       * **every state either works or names a way out of itself.** There is no
       * branch that leaves a toggle which silently does nothing, which is what
       * a permission-gated control degrades into if it only ever checks a
       * boolean.
       *
       *   granted         -> live chip, plus the device picker
       *   not-determined  -> togglable; turning it on is what asks
       *   denied          -> slashed glyph, orange, and an Open Settings button
       *   restricted      -> disabled, with a sentence; no button would help
       *   unknown         -> togglable and optimistic; let the recorder report
       */
      function renderMic(video) {
        const blocked = state.micStatus === 'denied' || state.micStatus === 'restricted';
        const on = state.mic && !blocked;

        btnMic.hidden = !video || !micSupported;
        btnMic.setAttribute('aria-pressed', String(on));
        btnMic.disabled = state.micStatus === 'restricted';
        if (blocked) btnMic.dataset.blocked = '1';
        else delete btnMic.dataset.blocked;

        // The slashed glyph means "cannot", never merely "off" -- off is
        // already carried by the unpressed chip, and using one mark for both
        // would make an available microphone look broken.
        micGlyphOn.hidden = blocked;
        micGlyphOff.hidden = !blocked;
        micLabel.textContent = state.micStatus === 'restricted' ? 'Mic restricted' : 'Microphone';

        // The picker, only while there is something to pick from.
        micDevice.hidden = !video || !on || state.devices.length === 0;
        // And the way out, only while the user has actually asked for a
        // microphone. Gated on `state.mic` for the same reason the note is:
        // the two appear and disappear together, and an orange button with no
        // sentence beside it is an alarm about nothing. A user who has the mic
        // off is not blocked on anything.
        //
        // `restricted` gets no button either, because there is none that would
        // help — a policy decided it, and the note says so instead.
        micGrant.hidden =
          !video || !micSupported || !state.mic || !blocked || state.micStatus === 'restricted';
        micGrant.textContent = 'Open Settings';
      }

      function micNote() {
        if (!micSupported || !state.mic) return '';
        if (state.micStatus === 'restricted') {
          return 'Microphone access is restricted on this device, so recordings will have no narration.';
        }
        if (state.micStatus === 'denied') {
          // Names the place, because on both platforms that is now the ONLY
          // route -- macOS shows no second prompt once access has been refused.
          return 'Microphone access is turned off. Open Settings allows it — this snip closes, so press the shortcut again afterwards.';
        }
        if (state.micStatus === 'not-determined') {
          return 'Your microphone will be requested when the recording starts.';
        }
        if (state.micStatus === 'granted' && state.micDevicesBlocked) {
          // The hardware is present and the OS has allowed us; something on our
          // side refused the device list. Never say "no microphone was found"
          // here — that sends the user to check a cable when the fault is ours,
          // and recording will in fact still capture the default input.
          return 'The microphone list could not be read. Recording will still use your default microphone.';
        }
        if (state.micStatus === 'granted' && state.devices.length === 0) {
          return 'No microphone was found. The recording will continue without narration.';
        }
        return '';
      }

      function renderBar() {
        const video = state.mode === 'video';
        btnImage.setAttribute('aria-pressed', String(!video));
        btnVideo.setAttribute('aria-pressed', String(video));

        // The audio toggles exist ONLY in Video mode. In Image mode there is
        // no audio to configure, so a visible-but-inert control would be a
        // question the user cannot answer.
        for (const el of [btnSys, audioSep]) el.hidden = !video;
        btnSys.setAttribute('aria-pressed', String(state.system));
        renderMic(video);

        if (!video) { setNote(''); return; }

        btnSys.disabled = !systemAudioSupported;
        // One note line, and both sources can have something to say. The
        // microphone wins when it does, because its message is actionable
        // ("open settings") where the platform one is merely a fact.
        const mic = micNote();
        if (mic) { setNote(mic); return; }
        if (!systemAudioSupported) {
          // Named plainly rather than left as a dead toggle. A control that
          // does nothing and says nothing reads as a bug in the app.
          setNote('System audio capture is not available on this platform.');
          return;
        }
        setNote('');
      }

      /**
       * Re-read the OS status, then the device list.
       *
       * Called on every touch of the microphone control and whenever the
       * window regains focus -- the latter is what closes the loop on "go to
       * System Settings and come back", which is otherwise exactly where these
       * flows break: the user grants access, returns, and the app is still
       * showing the refusal it cached at load.
       */
      async function refreshMic() {
        if (!micSupported || !window.snipAPI.micStatus) return;
        try {
          const info = await window.snipAPI.micStatus();
          state.micStatus = info && info.status ? info.status : 'unknown';
        } catch {
          state.micStatus = 'unknown';
        }
        await refreshDevices();
        renderBar();
      }

      /**
       * List the audio inputs.
       *
       * Labels are populated only once the permission is granted -- Chromium
       * withholds them otherwise, which is why this runs AFTER the status read
       * and why a picker built before the grant reads "Microphone 1,
       * Microphone 2". Main allows this window the permission *check* for
       * exactly this call; it is still refused `getUserMedia`, so nothing here
       * can open a device.
       */
      async function refreshDevices() {
        // `state.mic` is part of the condition, not just the status. Main
        // only permits the label read while the toggle is ON, so enumerating
        // with it off is both pointless — there is no picker to fill — and
        // actively misleading: it would come back blocked every time and log
        // a failure that is really just the gate working as designed.
        if (!state.mic || state.micStatus !== 'granted' || !navigator.mediaDevices) {
          state.devices = [];
          state.micDevicesBlocked = false;
          renderDevices();
          return;
        }
        try {
          const all = await navigator.mediaDevices.enumerateDevices();
          // Counted BEFORE the filter, because the count is the evidence.
          // Chromium hands a context without microphone permission a full set
          // of `audioinput` entries whose `deviceId` and `label` are both
          // empty strings — so filtering first throws away the one signal that
          // tells "permission withheld" apart from "no hardware".
          const inputs = all.filter((device) => device.kind === 'audioinput');
          state.devices = inputs
            .filter((device) => device.deviceId)
            .map((device) => ({ deviceId: device.deviceId, label: device.label }));
          state.micDevicesBlocked = inputs.length > 0 && state.devices.length === 0;
          if (state.micDevicesBlocked) {
            // Logged as well as shown. This is our own plumbing failing — main
            // gates the label permission on `snipConfig.micEnabled` — and a
            // failure the user can see and nobody can diagnose is the worst of
            // both.
            console.error(
              '[snip] microphone devices enumerated with blank ids —',
              'the label permission was refused for this surface',
            );
          }
        } catch {
          state.devices = [];
          state.micDevicesBlocked = false;
        }
        renderDevices();
      }

      function renderDevices() {
        micDevice.textContent = '';
        // "System default" is a real, selectable choice rather than an empty
        // first row -- it is what most people want, and it is the one option
        // that stays correct when they plug a headset in tomorrow.
        const fallback = document.createElement('option');
        fallback.value = '';
        fallback.textContent = 'System default';
        micDevice.appendChild(fallback);

        let matched = false;
        for (const device of state.devices) {
          const option = document.createElement('option');
          option.value = device.deviceId;
          // A label can still be empty on some platforms even with permission.
          option.textContent = device.label || 'Microphone';
          if (device.deviceId === state.micDeviceId) matched = true;
          micDevice.appendChild(option);
        }
        // **A stored id is a preference, not a promise.** It is per-machine, so
        // the same account on a second laptop holds one that matches nothing;
        // falling back to the default there keeps the mic working instead of
        // failing on a constraint nobody can see.
        if (!matched) state.micDeviceId = '';
        micDevice.value = state.micDeviceId;
      }

      /**
       * Sticky between captures, so the user sets these once rather than every
       * time the surface opens.
       *
       * **Returns a promise, and the microphone path awaits it.** This is not
       * only persistence: main gates the device-label permission on its own
       * copy of `micEnabled` (`surfaceMayListDevices`), so enumerating before
       * main has applied the change returns a list with every `deviceId`
       * blanked — which reads, from here, exactly like a machine with no
       * microphone. Callers that do not enumerate afterwards may ignore the
       * promise; the rejection is swallowed here either way, because losing a
       * preference must never surface as an error over the capture the user is
       * in the middle of.
       */
      function persist() {
        return Promise.resolve(
          window.snipAPI.saveAudioPrefs({
            systemAudioEnabled: state.system,
            micEnabled: state.mic,
            micDeviceId: state.micDeviceId,
          }),
        ).catch(() => {});
      }

      btnImage.addEventListener('click', () => { state.mode = 'image'; renderBar(); });
      btnVideo.addEventListener('click', () => {
        if (!videoSupported) return;
        state.mode = 'video';
        renderBar();
        // Entering Video is the first moment the microphone controls are on
        // screen, so it is the first moment their state has to be true. The
        // seed from main is already a beat old by now.
        void refreshMic();
      });

      btnSys.addEventListener('click', () => {
        if (!systemAudioSupported) return;
        state.system = !state.system;
        renderBar();
        persist();
      });

      /**
       * Turning the microphone ON is what asks for it.
       *
       * Deliberately not a separate "allow microphone" step the user has to
       * find first. The toggle is the intent, so the intent is what triggers
       * the request -- which on macOS at `not-determined` is the OS prompt,
       * and everywhere else is a status read that tells us which of the three
       * unhappy states we are in.
       *
       * Turning it OFF never prompts and never checks. Switching a thing off
       * should not make the operating system ask the user a question.
       */
      btnMic.addEventListener('click', async () => {
        if (!micSupported || state.micStatus === 'restricted') return;

        if (state.mic) {
          state.mic = false;
          renderBar();
          persist();
          return;
        }

        state.mic = true;
        renderBar();
        // **Persist FIRST, and await it.** Main gates this window's access to
        // device labels on its own `snipConfig.micEnabled`, so it has to have
        // applied the toggle before the enumeration below runs. Enumerating
        // first returned a list with every `deviceId` blanked, which the page
        // could only read as "no microphone" — the exact symptom of toggling
        // the microphone off and back on. Do not reorder these two.
        await persist();
        // A STATUS READ, never a prompt. Raising the macOS permission dialog
        // from this window would take focus, and on a single-display setup a
        // blur here tears the whole snip down (`armSnipOverlays`) — the user
        // would lose their selection to a question they had not answered yet.
        // The prompt belongs after the surfaces are destroyed, which is where
        // `startSnipRecording` raises it.
        await refreshMic();
      });

      micDevice.addEventListener('change', () => {
        state.micDeviceId = micDevice.value;
        persist();
      });

      /**
       * The way out of a refusal.
       *
       * It opens the OS page on BOTH platforms, which is the substantive
       * difference from the screen-recording flow -- there, Windows has no
       * per-app permission at all and an "Open Settings" button would be a
       * button that does nothing. The microphone is grantable on both, so this
       * control is never dead.
       *
       * Note it does NOT re-call the prompt. Once access has been refused
       * macOS resolves `askForMediaAccess` with the existing status and shows
       * no alert, so a button wired to that would appear broken -- which is
       * the single most common way this flow is got wrong.
       */
      micGrant.addEventListener('click', () => {
        if (window.snipAPI.openMicSettings) {
          window.snipAPI.openMicSettings().catch(() => {});
        }
        /*
          **And cancel the snip, deliberately.**

          This surface is full-screen and always-on-top, so the Settings window
          we just opened is underneath it and unreachable — the user would be
          looking at a window they cannot click. On a single display the blur
          would tear the snip down anyway (`armSnipOverlays`); doing it
          explicitly makes the behaviour identical on two displays, where it
          would not.

          It is not a loss of work: nothing has been captured, the toggle is
          already persisted, and the note above this button has told them to
          allow access and press the shortcut again. The alternative — holding
          a transparent overlay over the settings page they were just sent to —
          is the one thing that would be genuinely broken.
        */
        cancel();
      });

      // A click on the bar must not begin a drag, and must not cancel. The
      // surface's own handlers are on `document`, so this stops the event
      // before it gets there rather than testing the target up there.
      for (const type of ['mousedown', 'mouseup', 'mousemove']) {
        bar.addEventListener(type, (event) => { event.stopPropagation(); });
      }

      if (hasControls) {
        if (!videoSupported) {
          // Nothing to choose between — an Image-only segmented control is a
          // label pretending to be a control.
          btnVideo.hidden = true;
          btnImage.hidden = true;
        }
        renderBar();
        bar.classList.add('visible');
      }

      // -- The drag -----------------------------------------------------

      document.addEventListener('mousedown', (event) => {
        // Right/middle click cancels — the same escape hatch as Escape, for a
        // user whose hand is already on the mouse.
        if (event.button !== 0) { cancel(); return; }
        origin = { x: event.clientX, y: event.clientY };
        draw(rectFrom(origin, origin));
      });

      document.addEventListener('mousemove', (event) => {
        if (!origin) return;
        draw(rectFrom(origin, { x: event.clientX, y: event.clientY }));
      });

      document.addEventListener('mouseup', (event) => {
        if (!origin || settled) return;
        const rect = rectFrom(origin, { x: event.clientX, y: event.clientY });
        origin = null;

        // A click with no drag is how a user says "not this screen" as often as
        // it is a mistake, so it cancels rather than capturing a few stray
        // pixels they would then have to delete.
        if (rect.width < MIN_SIDE || rect.height < MIN_SIDE) { cancel(); return; }

        settled = true;
        clearMarks();
        const payload = {
          rect,
          // A surface with no bar cannot have chosen video, whatever it sends.
          mode: hasControls && videoSupported ? state.mode : 'image',
          audio: {
            system: state.system,
            // Main re-checks both against the platform and, for the mic,
            // against the OS permission -- this is a preference, not an
            // authorisation. See `recorderMediaAllowed`.
            mic: state.mic && state.micStatus !== 'denied' && state.micStatus !== 'restricted',
            micDeviceId: state.micDeviceId,
          },
        };
        // The commit is deferred one frame so the browser has actually painted
        // the cleared state before main hides the window and photographs the
        // screen. Sending in the same tick races our own compositor and can put
        // the selection border into the capture.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => window.snipAPI.commit(payload));
        });
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') cancel();
      });

      // NOTE: there is deliberately no `blur` -> cancel here. With two displays
      // there are two surfaces and only one can be key, so a blur handler in the
      // page would cancel the whole snip the moment the second window opened,
      // and again whenever the cursor crossed screens. Main owns that rule,
      // because main is the only side that knows how many surfaces exist; see
      // `armSnipOverlays` in electron/main.js.
    })();
  </script>
</body>
</html>
