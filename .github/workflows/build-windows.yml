name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      # npmRebuild=false: every native dep here is N-API and already installed
      # for win32-x64 by `npm ci` (uiohook-napi + koffi ship prebuilds, sqlite3
      # pulls a napi prebuild), so the Electron rebuild has nothing to do. Left
      # on, @electron/rebuild misses uiohook-napi's prebuild (it is named
      # uiohook-napi.node, not node.napi.node) and compiles it from source with
      # node-gyp, which dies with "Could not find any Visual Studio installation".
      # Windows-only: the mac job builds x64 on an arm64 runner and NEEDS the
      # rebuild step to swap in the other arch's binaries.
      - name: Build Windows installer
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish always --config.npmRebuild=false
