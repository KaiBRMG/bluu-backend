name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      # notarytool needs the App Store Connect key as a file on disk. RUNNER_TEMP
      # is outside the workspace, so the key can never be swept into the build.
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # We import the Developer ID cert ourselves instead of handing CSC_LINK /
      # CSC_KEY_PASSWORD to electron-builder. electron-builder 26.8.1 creates its
      # temp keychain with a random password but then calls
      #   security set-key-partition-list ... -k <p12 export password>
      # (app-builder-lib/out/codeSign/macCodeSign.js:140 vs :169) — it passes the
      # .p12 password where the KEYCHAIN password belongs. Older macOS let that
      # slide while the keychain was already unlocked; macOS 26 re-authenticates,
      # so the build dies with "SecKeychainUnlock: The user name or passphrase you
      # entered is not correct" immediately after a successful `security import`.
      # With CSC_LINK unset, electron-builder skips keychain creation entirely and
      # falls back to identity auto-discovery over the user keychain search list —
      # which is where this step puts the cert.
      - name: Import Developer ID certificate into a temp keychain
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$MAC_CSC_LINK" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # -lut 21600: no auto-lock for the life of the job. A locked keychain
          # mid-build fails signing with the same confusing passphrase error.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          # The keychain password — not the p12 password. This is the line
          # electron-builder gets wrong.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          # Put it on the user search list so `security find-identity` (and thus
          # electron-builder's auto-discovery) can see it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_PATH"

          echo "Signing identities available:"
          security find-identity -v -p codesigning

      # Both architectures are built in one job on purpose: each electron-builder
      # run emits a latest-mac.yml listing only the artifacts it produced. Split
      # across matrix jobs, the second job's manifest overwrites the first's in
      # the release and auto-update breaks for that architecture.
      #
      # NOTE: CSC_LINK / CSC_KEY_PASSWORD are deliberately NOT set here — see the
      # import step above. Setting either one re-enables the broken code path.
      - name: Build, sign, notarize and publish macOS DMG + ZIP
        working-directory: electron
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:mac -- --publish always

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
